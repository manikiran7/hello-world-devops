name: Reusable Socket.dev

on:
  workflow_call:
    secrets:
      SOCKET_SECURITY_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  socket:
    name: Socket.dev
    runs-on: [self-hosted, runner-2]

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Socket CLI
        run: socket --version

      - name: Socket.dev Scan
        env:
          SOCKET_SECURITY_API_TOKEN: ${{ secrets.SOCKET_SECURITY_API_TOKEN }}
        run: socket scan create .