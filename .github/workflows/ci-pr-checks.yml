name: CI Pipeline

on:
  push:
    branches:
      - "feature/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      security_scan:
        description: "Select check or security scan to run"
        required: true
        type: choice
        options:
          - test
          - sonarqube
          - codeql
          - trivy
          - snyk
          - semgrep
          - gitleaks
          - socket

permissions:
  contents: read
  security-events: write

jobs:



  test:
    name: Test & Quality

    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.security_scan == 'test'
      )

    runs-on: [self-hosted, runner-1]

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Node.js
        run: node --version

      - name: Check npm
        run: npm --version

      - name: Install Dependencies
        run: npm ci

      - name: NJSSCAN
        run: njsscan .

      - name: Biome Check
        run: npm run format:check

      - name: ESLint
        run: npm run lint




  sonarqube:
    name: SonarQube Security Scan

    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.security_scan == 'sonarqube'
      )

    uses: ./.github/workflows/sonarqube.yml
    secrets: inherit


  # ============================================================
  # CODEQL
  # ============================================================

  codeql:
    name: CodeQL Security Scan

    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.security_scan == 'codeql'
      )

    uses: ./.github/workflows/codeql.yml



  trivy:
    name: Trivy Security Scan

    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.security_scan == 'trivy'
      )

    uses: ./.github/workflows/trivy.yml




  snyk:
    name: Snyk Security Scan

    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.security_scan == 'snyk'
      )

    uses: ./.github/workflows/snyk.yml
    secrets: inherit




  semgrep:
    name: Semgrep Security Scan

    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.security_scan == 'semgrep'
      )

    uses: ./.github/workflows/semgrep.yml




  gitleaks:
    name: Gitleaks Security Scan

    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.security_scan == 'gitleaks'
      )

    uses: ./.github/workflows/gitleaks.yml




  socket:
    name: Socket.dev Security Scan

    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.security_scan == 'socket'
      )

    uses: ./.github/workflows/socket.yml
    secrets: inherit
  
 summary:
  name: CI Summary

  needs:
    - test
    - sonarqube
    - codeql
    - trivy
    - snyk
    - semgrep
    - gitleaks
    - socket

  if: always()

  runs-on: [self-hosted, runner-1]

  defaults:
    run:
      shell: cmd

  steps:

    - name: Download Trivy Report
      if: always() && needs.trivy.result != 'skipped'
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: trivy-results
        path: reports/trivy

    - name: Parse Trivy Results
      if: always() && needs.trivy.result != 'skipped'
      shell: powershell
      run: |
        $file = "reports/trivy/trivy-results.json"

        if (!(Test-Path $file)) {
            Write-Host "Trivy report not found"
            exit 0
        }

        $report = Get-Content $file -Raw | ConvertFrom-Json

        $findings = @()

        foreach ($result in $report.Results) {

            if ($null -eq $result.Vulnerabilities) {
                continue
            }

            foreach ($vuln in $result.Vulnerabilities) {

                $location = $result.Target
                $line = ""

                if ($null -ne $result.Packages) {
                    foreach ($pkg in $result.Packages) {

                        if ($pkg.ID -eq $vuln.PkgID) {

                            if ($null -ne $pkg.Locations) {
                                $line = $pkg.Locations[0].StartLine
                            }
                        }
                    }
                }

                $findings += [PSCustomObject]@{
                    Severity         = $vuln.Severity
                    VulnerabilityID  = $vuln.VulnerabilityID
                    Package          = $vuln.PkgName
                    InstalledVersion = $vuln.InstalledVersion
                    FixedVersion     = $vuln.FixedVersion
                    Target           = $location
                    Line             = $line
                    Title            = $vuln.Title
                }
            }
        }

        $findings | ConvertTo-Json -Depth 10 | Set-Content trivy-findings.json

        Write-Host "Trivy findings:"
        $findings | Format-Table -AutoSize

    - name: Generate Trivy Summary
      if: always() && needs.trivy.result != 'skipped'
      shell: powershell
      run: |
        $file = "trivy-findings.json"

        if (!(Test-Path $file)) {
            exit 0
        }

        $findings = Get-Content $file -Raw | ConvertFrom-Json

        if ($findings -isnot [array]) {
            $findings = @($findings)
        }

        $critical = @($findings | Where-Object { $_.Severity -eq "CRITICAL" }).Count
        $high     = @($findings | Where-Object { $_.Severity -eq "HIGH" }).Count
        $medium   = @($findings | Where-Object { $_.Severity -eq "MEDIUM" }).Count
        $low      = @($findings | Where-Object { $_.Severity -eq "LOW" }).Count
        $unknown  = @($findings | Where-Object { $_.Severity -eq "UNKNOWN" }).Count
        $total    = @($findings).Count

        @"
        ## Trivy Security Summary

        | Severity | Count |
        |---|---:|
        | Critical | $critical |
        | High | $high |
        | Medium | $medium |
        | Low | $low |
        | Unknown | $unknown |
        | **Total** | **$total** |

        "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

        @"
        ## Trivy Detailed Findings

        | Severity | CVE | Package | Installed | Fixed | Target | Line | Title |
        |---|---|---|---|---|---|---:|---|
        "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

        foreach ($item in $findings) {
            "| $($item.Severity) | $($item.VulnerabilityID) | $($item.Package) | $($item.InstalledVersion) | $($item.FixedVersion) | $($item.Target) | $($item.Line) | $($item.Title) |" |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
        }

    - name: Generate CI Summary
      env:
        TEST_RESULT: ${{ needs.test.result }}
        SONAR_RESULT: ${{ needs.sonarqube.result }}
        CODEQL_RESULT: ${{ needs.codeql.result }}
        TRIVY_RESULT: ${{ needs.trivy.result }}
        SNYK_RESULT: ${{ needs.snyk.result }}
        SEMGREP_RESULT: ${{ needs.semgrep.result }}
        GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
        SOCKET_RESULT: ${{ needs.socket.result }}
      run: |
        echo # CI Pipeline Report>>%GITHUB_STEP_SUMMARY%

        ...
