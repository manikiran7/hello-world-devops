name: CI Pipeline

on:
  push:
    branches:
      - "feature/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      security_scan:
        description: "Select check or security scan to run"
        required: true
        type: choice
        options:
          - test
          - sonarqube
          - codeql
          - trivy
          - snyk
          - semgrep
          - gitleaks
          - socket

permissions:
  contents: read
  security-events: write

jobs:

  # ============================================================
  # TEST & QUALITY
  # ============================================================

  test:
    name: Test & Quality

    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.security_scan == 'test'
      )

    runs-on: [self-hosted, runner-1]

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Node.js
        run: node --version

      - name: Check npm
        run: npm --version

      - name: Install Dependencies
        run: npm ci

      - name: NJSSCAN
        run: njsscan .

      - name: Biome Check
        run: npm run format:check

      - name: ESLint
        run: npm run lint


  # ============================================================
  # SONARQUBE
  # ============================================================

  sonarqube:
    name: SonarQube Security Scan

    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.security_scan == 'sonarqube'
      )

    uses: ./.github/workflows/sonarqube.yml
    secrets: inherit


  # ============================================================
  # CODEQL
  # ============================================================

  codeql:
    name: CodeQL Security Scan

    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.security_scan == 'codeql'
      )

    uses: ./.github/workflows/codeql.yml


  # ============================================================
  # TRIVY
  # ============================================================

  trivy:
    name: Trivy Security Scan

    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.security_scan == 'trivy'
      )

    uses: ./.github/workflows/trivy.yml


  # ============================================================
  # SNYK
  # ============================================================

  snyk:
    name: Snyk Security Scan

    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.security_scan == 'snyk'
      )

    uses: ./.github/workflows/snyk.yml
    secrets: inherit


  # ============================================================
  # SEMGREP
  # ============================================================

  semgrep:
    name: Semgrep Security Scan

    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.security_scan == 'semgrep'
      )

    uses: ./.github/workflows/semgrep.yml


  # ============================================================
  # GITLEAKS
  # ============================================================

  gitleaks:
    name: Gitleaks Security Scan

    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.security_scan == 'gitleaks'
      )

    uses: ./.github/workflows/gitleaks.yml


  # ============================================================
  # SOCKET.DEV
  # ============================================================

  socket:
    name: Socket.dev Security Scan

    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.security_scan == 'socket'
      )

    uses: ./.github/workflows/socket.yml
    secrets: inherit


  # ============================================================
  # CI SUMMARY
  # ============================================================

  summary:
    name: CI Summary

    needs:
      - test
      - sonarqube
      - codeql
      - trivy
      - snyk
      - semgrep
      - gitleaks
      - socket

    if: always()

    runs-on: [self-hosted, runner-1]

    defaults:
      run:
        shell: cmd

    steps:

      - name: Generate CI Summary

        env:
          TEST_RESULT: ${{ needs.test.result }}
          SONAR_RESULT: ${{ needs.sonarqube.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          SNYK_RESULT: ${{ needs.snyk.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          SOCKET_RESULT: ${{ needs.socket.result }}

        run: |
          echo # CI Pipeline Security Report>>%GITHUB_STEP_SUMMARY%
          echo.>>%GITHUB_STEP_SUMMARY%

          echo ## Build Information>>%GITHUB_STEP_SUMMARY%
          echo.>>%GITHUB_STEP_SUMMARY%
          echo ^| Property ^| Value ^|>>%GITHUB_STEP_SUMMARY%
          echo ^|---^|---^|>>%GITHUB_STEP_SUMMARY%
          echo ^| Repository ^| %GITHUB_REPOSITORY% ^|>>%GITHUB_STEP_SUMMARY%
          echo ^| Branch ^| %GITHUB_REF_NAME% ^|>>%GITHUB_STEP_SUMMARY%
          echo ^| Commit ^| %GITHUB_SHA% ^|>>%GITHUB_STEP_SUMMARY%
          echo ^| Build ^| #%GITHUB_RUN_NUMBER% ^|>>%GITHUB_STEP_SUMMARY%
          echo.>>%GITHUB_STEP_SUMMARY%

          echo ## Test ^& Quality>>%GITHUB_STEP_SUMMARY%
          echo.>>%GITHUB_STEP_SUMMARY%
          echo ^| Check ^| Result ^|>>%GITHUB_STEP_SUMMARY%
          echo ^|---^|---^|>>%GITHUB_STEP_SUMMARY%
          echo ^| NJSSCAN ^| %TEST_RESULT% ^|>>%GITHUB_STEP_SUMMARY%
          echo ^| Biome ^| %TEST_RESULT% ^|>>%GITHUB_STEP_SUMMARY%
          echo ^| ESLint ^| %TEST_RESULT% ^|>>%GITHUB_STEP_SUMMARY%
          echo.>>%GITHUB_STEP_SUMMARY%

          echo ## Security Scans>>%GITHUB_STEP_SUMMARY%
          echo.>>%GITHUB_STEP_SUMMARY%
          echo ^| Security Scan ^| Result ^|>>%GITHUB_STEP_SUMMARY%
          echo ^|---^|---^|>>%GITHUB_STEP_SUMMARY%
          echo ^| SonarQube ^| %SONAR_RESULT% ^|>>%GITHUB_STEP_SUMMARY%
          echo ^| CodeQL ^| %CODEQL_RESULT% ^|>>%GITHUB_STEP_SUMMARY%
          echo ^| Trivy ^| %TRIVY_RESULT% ^|>>%GITHUB_STEP_SUMMARY%
          echo ^| Snyk ^| %SNYK_RESULT% ^|>>%GITHUB_STEP_SUMMARY%
          echo ^| Semgrep ^| %SEMGREP_RESULT% ^|>>%GITHUB_STEP_SUMMARY%
          echo ^| Gitleaks ^| %GITLEAKS_RESULT% ^|>>%GITHUB_STEP_SUMMARY%
          echo ^| Socket.dev ^| %SOCKET_RESULT% ^|>>%GITHUB_STEP_SUMMARY%
          echo.>>%GITHUB_STEP_SUMMARY%

          echo ## Pipeline Status>>%GITHUB_STEP_SUMMARY%
          echo.>>%GITHUB_STEP_SUMMARY%
          echo ^| Component ^| Result ^|>>%GITHUB_STEP_SUMMARY%
          echo ^|---^|---^|>>%GITHUB_STEP_SUMMARY%
          echo ^| Test ^& Quality ^| %TEST_RESULT% ^|>>%GITHUB_STEP_SUMMARY%
          echo ^| SonarQube ^| %SONAR_RESULT% ^|>>%GITHUB_STEP_SUMMARY%
          echo ^| CodeQL ^| %CODEQL_RESULT% ^|>>%GITHUB_STEP_SUMMARY%
          echo ^| Trivy ^| %TRIVY_RESULT% ^|>>%GITHUB_STEP_SUMMARY%
          echo ^| Snyk ^| %SNYK_RESULT% ^|>>%GITHUB_STEP_SUMMARY%
          echo ^| Semgrep ^| %SEMGREP_RESULT% ^|>>%GITHUB_STEP_SUMMARY%
          echo ^| Gitleaks ^| %GITLEAKS_RESULT% ^|>>%GITHUB_STEP_SUMMARY%
          echo ^| Socket.dev ^| %SOCKET_RESULT% ^|>>%GITHUB_STEP_SUMMARY%
