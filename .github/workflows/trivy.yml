name: Reusable Trivy

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Trivy Security Scan
    runs-on: [self-hosted, runner-4]

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Add Trivy to PATH
        run: echo C:\Users\manikiran\tools\trivy>>%GITHUB_PATH%

      - name: Check Trivy
        run: trivy --version

      - name: Trivy Filesystem Scan - JSON
        run: |
          trivy fs . --format json --output trivy-results.json --exit-code 0

      - name: Check Trivy JSON Report
        run: |
          if exist trivy-results.json (
            echo Trivy JSON report created successfully
          ) else (
            echo Trivy JSON report was not created
            exit /b 1
          )

      - name: Trivy Filesystem Scan - SARIF
        run: |
          trivy fs . --format sarif --output trivy-results.sarif --exit-code 0

      - name: Check Trivy SARIF Report
        run: |
          if exist trivy-results.sarif (
            echo Trivy SARIF report created successfully
          ) else (
            echo Trivy SARIF report was not created
            exit /b 1
          )

      - name: Upload Trivy Results to GitHub
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Upload Trivy JSON Report
        if: always() && hashFiles('trivy-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.json
          if-no-files-found: ignore

      - name: Upload Trivy SARIF Report
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results-sarif
          path: trivy-results.sarif
          if-no-files-found: ignore
