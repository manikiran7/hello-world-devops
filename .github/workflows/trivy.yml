name: Reusable Trivy

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Trivy Security Scan
    runs-on: [self-hosted, runner-4]

    defaults:
      run:
        shell: cmd

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Add Trivy to PATH
        run: echo C:\Users\manikiran\tools\trivy>>%GITHUB_PATH%

      - name: Check Trivy
        run: trivy --version

      - name: Trivy Filesystem Scan
        run: |
          trivy fs . --format json --output trivy-results.json --exit-code 0

      - name: Check Trivy Report
        run: |
          if exist trivy-results.json (
            echo Trivy JSON report created successfully
          ) else (
            echo Trivy JSON report was not created
            exit /b 1
          )

      - name: Generate Trivy Summary
        shell: powershell
        run: |
          $file = "trivy-results.json"

          if (!(Test-Path $file)) {
              Write-Host "Trivy report not found"
              exit 0
          }

          $report = Get-Content $file -Raw | ConvertFrom-Json

          $findings = @()

          foreach ($result in $report.Results) {

              if ($null -eq $result.Vulnerabilities) {
                  continue
              }

              foreach ($vuln in $result.Vulnerabilities) {

                  $line = ""

                  if ($null -ne $result.Packages) {
                      foreach ($pkg in $result.Packages) {

                          if ($pkg.ID -eq $vuln.PkgID) {

                              if ($null -ne $pkg.Locations) {
                                  $line = $pkg.Locations[0].StartLine
                              }

                          }
                      }
                  }

                  $findings += [PSCustomObject]@{
                      Severity         = $vuln.Severity
                      CVE              = $vuln.VulnerabilityID
                      Package          = $vuln.PkgName
                      InstalledVersion = $vuln.InstalledVersion
                      FixedVersion     = $vuln.FixedVersion
                      Target           = $result.Target
                      Line             = $line
                      Title            = $vuln.Title
                  }
              }
          }

          # Severity counts

          $critical = @($findings | Where-Object Severity -eq "CRITICAL").Count
          $high     = @($findings | Where-Object Severity -eq "HIGH").Count
          $medium   = @($findings | Where-Object Severity -eq "MEDIUM").Count
          $low      = @($findings | Where-Object Severity -eq "LOW").Count
          $unknown  = @($findings | Where-Object Severity -eq "UNKNOWN").Count
          $total    = @($findings).Count

          # GitHub Summary

          @"
          ## Trivy Security Summary

          | Severity | Count |
          |---|---:|
          | Critical | $critical |
          | High | $high |
          | Medium | $medium |
          | Low | $low |
          | Unknown | $unknown |
          | **Total** | **$total** |

          ## Trivy Detailed Findings

          | Severity | CVE | Package | Installed | Fixed | Target | Line | Title |
          |---|---|---|---|---|---|---:|---|
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Append

          foreach ($item in $findings) {

              "| $($item.Severity) | $($item.CVE) | $($item.Package) | $($item.InstalledVersion) | $($item.FixedVersion) | $($item.Target) | $($item.Line) | $($item.Title) |" |
                  Out-File $env:GITHUB_STEP_SUMMARY -Append
          }

          # Save parsed findings for later consolidated reporting

          $findings | ConvertTo-Json -Depth 10 |
              Set-Content trivy-findings.json

      - name: Upload Trivy JSON Report
        if: always() && hashFiles('trivy-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.json
          if-no-files-found: ignore

      - name: Upload Trivy Parsed Findings
        if: always() && hashFiles('trivy-findings.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-findings
          path: trivy-findings.json
          if-no-files-found: ignore
