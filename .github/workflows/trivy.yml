name: Reusable Trivy

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Trivy Security Scan
    runs-on: [self-hosted, runner-4]

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Add Trivy to PATH
        run: echo C:\Users\manikiran\tools\trivy>>%GITHUB_PATH%

      - name: Check Trivy
        run: trivy --version

      - name: Trivy Filesystem Scan
        run: trivy fs . --severity HIGH,CRITICAL --format sarif --output trivy-results.sarif --exit-code 0

      - name: Upload Trivy Results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Upload Trivy Artifact
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: ignore