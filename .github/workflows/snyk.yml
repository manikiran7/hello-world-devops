name: Reusable Snyk

on:
  workflow_call:
    secrets:
      SNYK_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  snyk:
    name: Snyk Security Scan
    runs-on: [self-hosted, runner-5]

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Add Snyk to PATH
        run: echo C:\Users\manikiran\AppData\Roaming\npm>>%GITHUB_PATH%

      - name: Check Node.js
        run: node --version

      - name: Check npm
        run: npm --version

      - name: Check Snyk
        run: snyk --version

      - name: Install Dependencies
        run: npm ci

      - name: Snyk Test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --json > snyk-results.json || exit /b 0

      - name: Check Snyk Report
        run: |
          if exist snyk-results.json (
            echo Snyk report created successfully
          ) else (
            echo Snyk report was not created
            exit /b 1
          )

      - name: Snyk Monitor
        if: always()
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk monitor

      - name: Upload Snyk Report
        if: always() && hashFiles('snyk-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: snyk-results
          path: snyk-results.json
          if-no-files-found: ignore
