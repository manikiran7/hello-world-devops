name: CI Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:

  test:
    name: Test Job
    runs-on: [self-hosted, runner-1]

    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: false


    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Node.js
        run: node --version

      - name: Check npm
        run: npm --version

      - name: Install Dependencies
        run: npm ci

      - name: Unit Test
        run: npm test

      - name: Biome Format
        run: npx biome format . --write

      - name: Biome Check
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  sonarqube:
    name: SonarQube Job
    needs: test
    runs-on: [self-hosted, runner-2]

    env:
      JAVA_HOME: C:\Users\manikiran\tools\jdk-21\jdk-21.0.12.1+1

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Add Java 21 to PATH
        run: echo C:\Users\manikiran\tools\jdk-21\jdk-21.0.12.1+1\bin>>%GITHUB_PATH%

      - name: Check Java
        run: |
          echo JAVA_HOME=%JAVA_HOME%
          java -version

      - name: Check Node.js
        run: node --version

      - name: Check npm
        run: npm --version

      - name: Install Dependencies
        run: npm ci

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: npx sonar-scanner -Dsonar.host.url=http://localhost:9000 -Dsonar.login=%SONAR_TOKEN%


  codeql:
    name: CodeQL Security Scan
    needs: test
    runs-on: [self-hosted, runner-3]

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"


  trivy:
    name: Trivy Security Scan
    needs: test
    runs-on: [self-hosted, runner-4]

    permissions:
      contents: read
      security-events: write

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Add Trivy to PATH
        run: echo C:\Users\manikiran\tools\trivy>>%GITHUB_PATH%

      - name: Check Trivy
        run: trivy --version

      - name: Trivy Filesystem Scan
        run: trivy fs . --severity HIGH,CRITICAL --format sarif --output trivy-results.sarif --exit-code 0

      - name: Upload Trivy Results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif



  snyk:
    name: Snyk Security Scan
    needs: test
    runs-on: [self-hosted, runner-5]

    permissions:
      contents: read

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Add Snyk to PATH
        run: echo C:\Users\manikiran\AppData\Roaming\npm>>%GITHUB_PATH%

      - name: Check Node.js
        run: node --version

      - name: Check npm
        run: npm --version

      - name: Check Snyk
        run: snyk --version

      - name: Install Dependencies
        run: npm ci

      - name: Snyk Test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=high

      - name: Snyk Monitor
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk monitor


  semgrep:
    name: Semgrep Security Scan
    needs: test
    runs-on: [self-hosted, runner-6]

    permissions:
      contents: read
      security-events: write

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Add Python Scripts to PATH
        run: echo C:\Users\manikiran\AppData\Local\Programs\Python\Python313\Scripts>>%GITHUB_PATH%

      - name: Check Python
        run: python --version

      - name: Check Semgrep
        run: semgrep --version

      - name: Run Semgrep
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          semgrep scan --config auto --sarif --output semgrep-results.sarif . || exit /b 0

      - name: Check SARIF
        run: |
          if exist semgrep-results.sarif (
            echo SARIF file created successfully
          ) else (
            echo SARIF file was not created
            exit /b 1
          )

      - name: Upload Semgrep Results
        if: always() && hashFiles('semgrep-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-results.sarif



  docker:
    name: Docker Build and Push
    needs:
      - test
      - sonarqube
      - codeql
      - trivy
      - snyk
      - semgrep

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: [self-hosted, runner-1]

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Docker
        run: docker --version

      - name: Docker Login
        run: docker login -u %DOCKER_USERNAME% -p %DOCKER_PASSWORD%
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set Image Tag
        run: echo IMAGE_TAG=%GITHUB_SHA:~0,7%>>%GITHUB_ENV%

      - name: Docker Build
        run: docker build -t mkr05/hello-world-devops:%IMAGE_TAG% .

      - name: Docker Scout
        run: docker scout cves mkr05/hello-world-devops:%IMAGE_TAG%

      - name: Docker Push
        run: docker push mkr05/hello-world-devops:%IMAGE_TAG%

      - name: Update Helm Image Tag
        shell: cmd
        run: |
          powershell.exe -ExecutionPolicy Bypass -Command "$file='helm/hello-world-devops/values.yaml'; $tag=$env:IMAGE_TAG; $content=Get-Content $file -Raw; $content=$content -replace '(?m)^\s*tag:\s*.*$', ('  tag: ' + [char]34 + $tag + [char]34); [System.IO.File]::WriteAllText($file, $content)"

      - name: Update image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/hello-world-devops/values.yaml
          git commit -m "Update image tag to ${{ github.sha }}" || echo No changes to commit

          git pull --rebase origin main
          git push origin main

