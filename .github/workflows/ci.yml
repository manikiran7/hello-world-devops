name: CI Pipeline

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Job
    runs-on: self-hosted

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Git Line Endings
        run: |
          git config core.autocrlf false
          git reset --hard HEAD

      - name: Check Node.js
        run: node --version

      - name: Check npm
        run: npm --version

      - name: Install Dependencies
        run: npm ci

      - name: Unit Test
        run: npm test

      - name: Biome Check
        run: npm run format:check

      - name: ESLint
        run: npm run lint