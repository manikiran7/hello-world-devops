name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Job
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Node.js
        run: node --version

      - name: Install Dependencies
        run: npm ci

      - name: Unit Test
        run: npm test

      - name: Biome Check
        run: npm run format:check

      - name: ESLint
        run: npm run lint