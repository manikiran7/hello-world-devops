services:
  postgres:
    image: postgres:17
    container_name: hello-world-postgres

    environment:
      POSTGRES_DB: hello_world
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres-data:
